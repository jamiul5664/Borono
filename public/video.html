<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Happy Birthday Borno - Birthday Video</title>
<link rel="icon" href="/favicon.ico" sizes="any" type="image/x-icon">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #ebeae4;
    user-select: none;
    -webkit-user-select: none;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  /* Full viewport container - completely edge to edge */
  .video-viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #ebeae4;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Main video fills 100% of space, no borders, no cards */
  .main-video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    object-fit: cover;
    object-position: center center;
    display: block;
    cursor: pointer;
    border: none;
    outline: none;
  }

  /* Center flash play/pause badge on click */
  .center-play-badge {
    position: absolute;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transform: scale(0.65);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 20;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }

  .center-play-badge.show {
    opacity: 1;
    transform: scale(1);
  }

  .center-play-badge svg {
    width: 32px;
    height: 32px;
    fill: #fff;
  }

  /* Floating sleek control bar at bottom */
  .floating-controls {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(0);
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    border-radius: 9999px;
    background: rgba(18, 18, 22, 0.72);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease, transform 0.35s ease, visibility 0.35s;
  }

  /* Show controls on hover or when playing state changes */
  .video-viewport:hover .floating-controls,
  .floating-controls.visible {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
  }

  .ctrl-btn {
    background: transparent;
    border: none;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    transition: all 0.2s ease;
  }

  .ctrl-btn:hover {
    background: rgba(244, 114, 182, 0.35);
    transform: scale(1.1);
  }

  .ctrl-btn svg {
    width: 17px;
    height: 17px;
    fill: #fff;
  }

  /* Seek bar inside floating controls */
  .seek-bar-track {
    width: 110px;
    height: 5px;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 9999px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .seek-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ec4899, #f472b6);
    border-radius: 9999px;
  }

  .time-text {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.85);
    letter-spacing: 0.05em;
    min-width: 68px;
    text-align: center;
  }

  /* Scroll next indicator pill */
  .scroll-next-pill {
    position: absolute;
    bottom: 24px;
    right: 28px;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 16px;
    border-radius: 9999px;
    background: rgba(18, 18, 22, 0.65);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: rgba(255, 255, 255, 0.9);
    font-family: 'Space Mono', monospace;
    font-size: 0.74rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    transition: all 0.25s ease;
    opacity: 0.75;
  }

  .scroll-next-pill:hover {
    opacity: 1;
    background: rgba(244, 114, 182, 0.25);
    border-color: rgba(244, 114, 182, 0.5);
    color: #fff;
    transform: translateY(2px);
  }

  .scroll-next-pill svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
    animation: bounceDown 1.5s infinite ease-in-out;
  }

  @keyframes bounceDown {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(3px); }
  }

  @media (max-width: 640px) {
    .floating-controls {
      bottom: 16px;
      padding: 6px 12px;
      gap: 8px;
    }
    .seek-bar-track {
      width: 70px;
    }
    .time-text {
      font-size: 0.68rem;
      min-width: 58px;
    }
    .scroll-next-pill {
      bottom: 74px;
      right: 50%;
      transform: translateX(50%);
    }
    .scroll-next-pill:hover {
      transform: translateX(50%) translateY(2px);
    }
  }
</style>
</head>
<body>

<div class="video-viewport" id="videoViewport">
  <!-- 100% Full-Screen Video (No borders, edge-to-edge) -->
  <video 
    id="mainVideo" 
    class="main-video" 
    src="/video/birthday-video.mp4" 
    autoplay 
    loop 
    muted 
    playsinline
  ></video>

  <!-- Big Play/Pause Center Flash Indicator -->
  <div class="center-play-badge" id="centerBadge">
    <svg id="badgePlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="badgePauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  </div>

  <!-- Floating Sleek Controls -->
  <div class="floating-controls" id="floatingControls">
    <button class="ctrl-btn" id="playBtn" aria-label="Play/Pause">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <button class="ctrl-btn" id="replayBtn" aria-label="Replay">
      <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
    </button>
    
    <div class="seek-bar-track" id="seekTrack">
      <div class="seek-bar-fill" id="seekFill"></div>
    </div>
    
    <span class="time-text" id="timeText">0:00 / 0:05</span>
    
    <button class="ctrl-btn" id="muteBtn" aria-label="Mute/Unmute">
      <svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
    </button>

    <button class="ctrl-btn" id="fsBtn" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>
  </div>

  <!-- Floating Scroll Down Prompt to Scrapbook -->
  <button class="scroll-next-pill" id="scrollNextBtn">
    <span>Scrapbook</span>
    <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
  </button>
</div>

<script>
  const mainVideo = document.getElementById('mainVideo');
  const playBtn = document.getElementById('playBtn');
  const replayBtn = document.getElementById('replayBtn');
  const muteBtn = document.getElementById('muteBtn');
  const fsBtn = document.getElementById('fsBtn');
  const seekTrack = document.getElementById('seekTrack');
  const seekFill = document.getElementById('seekFill');
  const timeText = document.getElementById('timeText');
  const centerBadge = document.getElementById('centerBadge');
  const badgePlayIcon = document.getElementById('badgePlayIcon');
  const badgePauseIcon = document.getElementById('badgePauseIcon');
  const floatingControls = document.getElementById('floatingControls');
  const scrollNextBtn = document.getElementById('scrollNextBtn');
  const videoViewport = document.getElementById('videoViewport');

  // Auto-hide floating controls after 2.5s idle
  let hideTimer;
  function showControlsBriefly() {
    floatingControls.classList.add('visible');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      floatingControls.classList.remove('visible');
    }, 2500);
  }

  videoViewport.addEventListener('mousemove', showControlsBriefly);
  videoViewport.addEventListener('touchstart', showControlsBriefly, { passive: true });

  // Time & Progress update
  mainVideo.addEventListener('timeupdate', () => {
    const cur = mainVideo.currentTime || 0;
    const dur = mainVideo.duration || 5;
    const pct = (cur / dur) * 100;
    seekFill.style.width = pct + '%';
    timeText.textContent = `${formatTime(cur)} / ${formatTime(dur)}`;
  });

  function formatTime(s) {
    const mins = Math.floor(s / 60);
    const secs = Math.floor(s % 60);
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
  }

  // Toggle Play / Pause
  function togglePlay() {
    if (mainVideo.paused) {
      mainVideo.play();
      showBadge(false);
      updatePlayIcons(false);
    } else {
      mainVideo.pause();
      showBadge(true);
      updatePlayIcons(true);
    }
    showControlsBriefly();
  }

  function showBadge(isPaused) {
    badgePlayIcon.style.display = isPaused ? 'block' : 'none';
    badgePauseIcon.style.display = isPaused ? 'none' : 'block';
    centerBadge.classList.add('show');
    setTimeout(() => {
      centerBadge.classList.remove('show');
    }, 450);
  }

  function updatePlayIcons(isPaused) {
    playBtn.innerHTML = isPaused 
      ? '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
  }

  mainVideo.addEventListener('click', togglePlay);
  playBtn.addEventListener('click', togglePlay);

  replayBtn.addEventListener('click', () => {
    mainVideo.currentTime = 0;
    mainVideo.play();
    updatePlayIcons(false);
    showControlsBriefly();
  });

  // Seeking
  seekTrack.addEventListener('click', (e) => {
    const rect = seekTrack.getBoundingClientRect();
    const pos = (e.clientX - rect.left) / rect.width;
    const target = pos * (mainVideo.duration || 5);
    mainVideo.currentTime = target;
    showControlsBriefly();
  });

  // Mute / Unmute
  muteBtn.addEventListener('click', () => {
    mainVideo.muted = !mainVideo.muted;
    if (mainVideo.muted) {
      muteBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>';
    } else {
      muteBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
    }
    showControlsBriefly();
  });

  // Fullscreen
  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  });

  // Autoplay
  window.addEventListener('DOMContentLoaded', () => {
    mainVideo.play().catch(() => {});
  });

  // Scroll to Next Section (section-2: Scrapbook)
  function scrollToNext() {
    try {
      const parentContainer = window.parent.document.getElementById('main-scroll-container');
      const target = window.parent.document.getElementById('section-2');
      if (target) {
        target.scrollIntoView({ behavior: 'smooth' });
      } else if (parentContainer) {
        parentContainer.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
      }
    } catch (e) {}
  }

  function scrollToPrev() {
    try {
      const parentContainer = window.parent.document.getElementById('main-scroll-container');
      const target = window.parent.document.getElementById('section-1');
      if (target) {
        target.scrollIntoView({ behavior: 'smooth' });
      } else if (parentContainer) {
        parentContainer.scrollBy({ top: -window.innerHeight, behavior: 'smooth' });
      }
    } catch (e) {}
  }

  scrollNextBtn.addEventListener('click', scrollToNext);

  // Wheel event forwarding to parent snap-container
  window.addEventListener('wheel', (e) => {
    try {
      const parentContainer = window.parent.document.getElementById('main-scroll-container');
      if (parentContainer) {
        parentContainer.scrollBy({ top: e.deltaY, behavior: 'auto' });
      }
    } catch (err) {}
  }, { passive: true });

  // Touch swipe support
  let touchStartY = 0;
  window.addEventListener('touchstart', (e) => {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  window.addEventListener('touchend', (e) => {
    const diffY = touchStartY - e.changedTouches[0].clientY;
    if (Math.abs(diffY) > 55) {
      if (diffY > 0) {
        scrollToNext();
      } else {
        scrollToPrev();
      }
    }
  }, { passive: true });

  // Keyboard navigation
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
      e.preventDefault();
      scrollToNext();
    } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
      e.preventDefault();
      scrollToPrev();
    }
  });
</script>

</body>
</html>
