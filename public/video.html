<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Happy Birthday Borno</title>
<link rel="icon" href="/favicon.ico" sizes="any" type="image/x-icon">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #ebeae4;
    user-select: none;
    -webkit-user-select: none;
  }

  .video-viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #ebeae4;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 100% Full-Screen Video Loop - No bars, no borders, no overlays */
  .main-video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    object-fit: cover;
    object-position: center center;
    display: block;
    border: none;
    outline: none;
    pointer-events: auto;
  }
</style>
</head>
<body>

<div class="video-viewport" id="videoViewport">
  <video 
    id="mainVideo" 
    class="main-video" 
    src="/video/birthday-video.mp4" 
    autoplay 
    loop 
    muted 
    playsinline
  ></video>
</div>

<script>
  const mainVideo = document.getElementById('mainVideo');

  // Keep video looping continuously; ensure it cannot be paused
  function startPlayback() {
    if (mainVideo.paused) {
      mainVideo.play().catch(() => {});
    }
  }

  window.addEventListener('DOMContentLoaded', startPlayback);
  window.addEventListener('click', startPlayback);
  window.addEventListener('touchstart', startPlayback, { passive: true });

  // Auto-resume if anything attempts to pause it
  mainVideo.addEventListener('pause', () => {
    mainVideo.play().catch(() => {});
  });

  // Seamless navigation: Scroll to next or previous section
  function scrollToNext() {
    try {
      const parentContainer = window.parent.document.getElementById('main-scroll-container');
      const target = window.parent.document.getElementById('section-2');
      if (target) {
        target.scrollIntoView({ behavior: 'smooth' });
      } else if (parentContainer) {
        parentContainer.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
      }
    } catch (e) {}
  }

  function scrollToPrev() {
    try {
      const parentContainer = window.parent.document.getElementById('main-scroll-container');
      const target = window.parent.document.getElementById('section-1');
      if (target) {
        target.scrollIntoView({ behavior: 'smooth' });
      } else if (parentContainer) {
        parentContainer.scrollBy({ top: -window.innerHeight, behavior: 'smooth' });
      }
    } catch (e) {}
  }

  // Wheel event forwarding to parent snap-container
  window.addEventListener('wheel', (e) => {
    try {
      const parentContainer = window.parent.document.getElementById('main-scroll-container');
      if (parentContainer) {
        parentContainer.scrollBy({ top: e.deltaY, behavior: 'auto' });
      }
    } catch (err) {}
  }, { passive: true });

  // Touch swipe support for mobile
  let touchStartY = 0;
  window.addEventListener('touchstart', (e) => {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  window.addEventListener('touchend', (e) => {
    const diffY = touchStartY - e.changedTouches[0].clientY;
    if (Math.abs(diffY) > 55) {
      if (diffY > 0) {
        scrollToNext();
      } else {
        scrollToPrev();
      }
    }
  }, { passive: true });

  // Keyboard navigation
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') {
      e.preventDefault();
      scrollToNext();
    } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
      e.preventDefault();
      scrollToPrev();
    }
  });
</script>

</body>
</html>
