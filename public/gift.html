<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Borno's Birthday Gift Machine</title>
<link rel="icon" href="/favicon.ico" sizes="any" type="image/x-icon">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Playfair+Display:ital,wght@0,600;1,600&family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/confetti.browser.js"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #09070f;
    color: #fff;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Full Viewport Container */
  .machine-screen {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem 1rem 1.8rem;
    overflow: hidden;
    background: radial-gradient(circle at 50% 25%, #251235 0%, #0c0816 65%, #050308 100%);
  }

  /* Floating background ambiance stars & lights */
  .bg-glow-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    opacity: 0.35;
    z-index: 1;
  }
  .orb-1 {
    width: 380px;
    height: 380px;
    background: #ec4899;
    top: 5%;
    left: 15%;
  }
  .orb-2 {
    width: 320px;
    height: 320px;
    background: #8b5cf6;
    bottom: 10%;
    right: 15%;
  }

  /* Sparkle canvas */
  #starsCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  /* Main Wrapper */
  .machine-wrapper {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 580px;
    height: 100%;
    gap: 0.75rem;
  }

  /* Marquee Header */
  .marquee-header {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25rem;
  }

  .badge-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.25rem 0.85rem;
    border-radius: 9999px;
    background: rgba(244, 114, 182, 0.15);
    border: 1px solid rgba(244, 114, 182, 0.4);
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    color: #f472b6;
    text-transform: uppercase;
    box-shadow: 0 0 16px rgba(244, 114, 182, 0.25);
  }

  .title-text {
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(1.4rem, 3.8vw, 2.1rem);
    letter-spacing: -0.02em;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 20%, #f472b6 60%, #fbbf24 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(244, 114, 182, 0.4);
  }

  .sub-text {
    font-size: clamp(0.72rem, 1.6vw, 0.84rem);
    color: rgba(255, 255, 255, 0.7);
    font-family: 'Space Mono', monospace;
  }

  /* Machine Housing */
  .machine-box {
    position: relative;
    width: 100%;
    max-width: 440px;
    background: linear-gradient(180deg, #1f1430 0%, #150d24 60%, #0d0718 100%);
    border-radius: 32px;
    border: 3px solid rgba(244, 114, 182, 0.45);
    box-shadow: 
      0 20px 50px rgba(0, 0, 0, 0.8),
      0 0 40px rgba(236, 72, 153, 0.25),
      inset 0 2px 6px rgba(255, 255, 255, 0.2);
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .machine-box.shaking {
    animation: machineRumble 0.6s infinite ease-in-out;
  }

  @keyframes machineRumble {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    20% { transform: translate(-3px, 2px) rotate(-0.8deg); }
    40% { transform: translate(3px, -2px) rotate(0.8deg); }
    60% { transform: translate(-2px, -1px) rotate(-0.5deg); }
    80% { transform: translate(2px, 3px) rotate(0.5deg); }
  }

  /* Glass Capsule Globe */
  .globe-chamber {
    position: relative;
    width: 100%;
    height: 180px;
    background: radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.12) 0%, rgba(30, 20, 50, 0.75) 80%);
    border-radius: 24px;
    border: 2px solid rgba(255, 255, 255, 0.18);
    box-shadow: 
      inset 0 10px 25px rgba(255, 255, 255, 0.15),
      inset 0 -10px 25px rgba(0, 0, 0, 0.6),
      0 8px 20px rgba(0, 0, 0, 0.4);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Glass reflection sheen */
  .globe-chamber::before {
    content: '';
    position: absolute;
    top: 8px;
    left: 12px;
    right: 12px;
    height: 35%;
    border-radius: 18px 18px 50% 50%;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0) 100%);
    pointer-events: none;
    z-index: 5;
  }

  /* Capsules bouncing inside chamber */
  .capsule-group {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .capsule {
    position: absolute;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    box-shadow: 
      0 6px 14px rgba(0,0,0,0.4),
      inset 0 4px 6px rgba(255,255,255,0.4),
      inset 0 -4px 6px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    transition: transform 0.4s ease;
  }

  .c1 { top: 65%; left: 16%; background: linear-gradient(135deg, #f43f5e, #fb7185); animation: floatCap1 3.5s infinite ease-in-out; }
  .c2 { top: 48%; left: 38%; background: linear-gradient(135deg, #a855f7, #c084fc); animation: floatCap2 4.2s infinite ease-in-out; }
  .c3 { top: 62%; left: 62%; background: linear-gradient(135deg, #ec4899, #f472b6); animation: floatCap3 3.8s infinite ease-in-out; }
  .c4 { top: 40%; left: 74%; background: linear-gradient(135deg, #f59e0b, #fbbf24); animation: floatCap1 4.5s infinite ease-in-out; }
  .c5 { top: 32%; left: 22%; background: linear-gradient(135deg, #06b6d4, #22d3ee); animation: floatCap2 3.2s infinite ease-in-out; }
  .c6 { top: 56%; left: 48%; background: linear-gradient(135deg, #10b981, #34d399); animation: floatCap3 4.8s infinite ease-in-out; }

  @keyframes floatCap1 {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(15deg); }
  }
  @keyframes floatCap2 {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-16px) rotate(-18deg); }
  }
  @keyframes floatCap3 {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(10deg); }
  }

  .globe-chamber.active .capsule {
    animation: capsuleJumble 0.25s infinite alternate !important;
  }

  @keyframes capsuleJumble {
    0% { transform: translate(-14px, 12px) rotate(35deg) scale(1.1); }
    100% { transform: translate(14px, -14px) rotate(-35deg) scale(0.95); }
  }

  /* Control Area */
  .control-area {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8rem;
  }

  /* Big Glossy Dispense Button */
  .dispense-btn {
    position: relative;
    width: 100%;
    padding: 0.95rem 1.5rem;
    border-radius: 9999px;
    background: linear-gradient(135deg, #ec4899 0%, #f43f5e 50%, #f59e0b 100%);
    border: none;
    cursor: pointer;
    box-shadow: 
      0 10px 25px rgba(244, 63, 94, 0.45),
      0 0 35px rgba(236, 72, 153, 0.4),
      inset 0 2px 4px rgba(255, 255, 255, 0.45),
      inset 0 -2px 6px rgba(0, 0, 0, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    color: #fff;
    font-family: 'Archivo Black', sans-serif;
    font-size: 1.05rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .dispense-btn:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 
      0 14px 30px rgba(244, 63, 94, 0.6),
      0 0 45px rgba(236, 72, 153, 0.6);
  }

  .dispense-btn:active {
    transform: translateY(2px) scale(0.98);
  }

  .dispense-btn.disabled {
    pointer-events: none;
    opacity: 0.7;
    filter: grayscale(0.2);
  }

  .btn-sparkle-icon {
    font-size: 1.25rem;
    animation: sparkleSpin 3s infinite linear;
  }

  @keyframes sparkleSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Dispenser Chute / Tray */
  .dispenser-chute {
    position: relative;
    width: 85%;
    height: 48px;
    background: #090510;
    border-radius: 14px;
    border: 2px solid rgba(255, 255, 255, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.8);
    overflow: hidden;
  }

  .chute-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    color: rgba(255, 255, 255, 0.4);
    text-transform: uppercase;
  }

  /* Dropping Capsule */
  .dropped-capsule {
    position: absolute;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #fbbf24, #f43f5e);
    box-shadow: 0 0 16px #f43f5e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    top: -50px;
    opacity: 0;
    transition: all 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 10;
  }

  .dropped-capsule.drop {
    top: 5px;
    opacity: 1;
    transform: scale(1.15) rotate(720deg);
  }

  /* Bottom Prompt to Scroll */
  .scroll-down-hint {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.45rem 1.1rem;
    border-radius: 9999px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: rgba(255, 255, 255, 0.75);
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .scroll-down-hint:hover {
    background: rgba(244, 114, 182, 0.2);
    color: #fff;
    border-color: rgba(244, 114, 182, 0.4);
  }

  .scroll-down-hint svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
    animation: bounceDown 1.5s infinite;
  }

  @keyframes bounceDown {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(3px); }
  }

  /* ---------------- Modal Gift Card Reveal ---------------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  .modal-backdrop.show {
    opacity: 1;
    pointer-events: auto;
  }

  .gift-card {
    position: relative;
    width: 100%;
    max-width: 480px;
    background: linear-gradient(135deg, #1d122b 0%, #170d24 50%, #0d0617 100%);
    border-radius: 28px;
    border: 2px solid rgba(244, 114, 182, 0.5);
    box-shadow: 
      0 25px 60px rgba(0, 0, 0, 0.9),
      0 0 50px rgba(236, 72, 153, 0.35),
      inset 0 1px 3px rgba(255, 255, 255, 0.25);
    padding: 2rem 1.75rem 1.75rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 1.15rem;
    transform: scale(0.85) translateY(20px);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .modal-backdrop.show .gift-card {
    transform: scale(1) translateY(0);
  }

  .card-top-icon {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ec4899, #f43f5e);
    box-shadow: 0 0 25px rgba(236, 72, 153, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    margin-top: -1.2rem;
    animation: heartBeat 1.8s infinite;
  }

  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.15); }
    30% { transform: scale(1.05); }
    45% { transform: scale(1.18); }
  }

  .card-header-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.74rem;
    letter-spacing: 0.12em;
    color: #fbbf24;
    text-transform: uppercase;
  }

  .message-box {
    width: 100%;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 1.25rem 1.15rem;
    position: relative;
    box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
  }

  .message-text {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(1rem, 2.5vw, 1.18rem);
    line-height: 1.65;
    color: #fff;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .card-actions {
    display: flex;
    flex-direction: column;
    width: 100%;
    gap: 0.65rem;
  }

  .again-btn {
    width: 100%;
    padding: 0.85rem 1.4rem;
    border-radius: 9999px;
    background: linear-gradient(135deg, #ec4899, #f43f5e);
    border: none;
    color: #fff;
    font-family: 'Archivo Black', sans-serif;
    font-size: 0.92rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(244, 63, 94, 0.4);
    transition: all 0.2s ease;
  }

  .again-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(244, 63, 94, 0.55);
  }

  .close-btn {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: rgba(255, 255, 255, 0.7);
    padding: 0.65rem;
    border-radius: 9999px;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .close-btn:hover {
    color: #fff;
    border-color: rgba(255, 255, 255, 0.4);
  }

  @media (max-width: 480px) {
    .machine-screen {
      padding: 0.75rem 0.75rem 1.25rem;
    }
    .globe-chamber {
      height: 150px;
    }
    .capsule {
      width: 36px;
      height: 36px;
      font-size: 1rem;
    }
    .dispense-btn {
      padding: 0.85rem 1.2rem;
      font-size: 0.95rem;
    }
    .gift-card {
      padding: 1.5rem 1.2rem 1.2rem;
    }
  }
</style>
</head>
<body>

<div class="machine-screen" id="machineScreen">
  <!-- Glowing orbs -->
  <div class="bg-glow-orb orb-1"></div>
  <div class="bg-glow-orb orb-2"></div>

  <!-- Stars canvas -->
  <canvas id="starsCanvas"></canvas>

  <div class="machine-wrapper">
    <!-- Header -->
    <header class="marquee-header">
      <div class="badge-tag">
        <span>✨ Birthday Special Dispenser ✨</span>
      </div>
      <h1 class="title-text">Borno's Gift Machine 🎁</h1>
      <p class="sub-text">Pull a surprise love note crafted just for you</p>
    </header>

    <!-- The Machine -->
    <div class="machine-box" id="machineBox">
      <!-- Glass Dome with Bouncing Capsules -->
      <div class="globe-chamber" id="globeChamber">
        <div class="capsule-group">
          <div class="capsule c1">🎁</div>
          <div class="capsule c2">💖</div>
          <div class="capsule c3">💌</div>
          <div class="capsule c4">✨</div>
          <div class="capsule c5">🎀</div>
          <div class="capsule c6">🌸</div>
        </div>
      </div>

      <!-- Control Area -->
      <div class="control-area">
        <button class="dispense-btn" id="dispenseBtn" aria-label="Dispense Gift">
          <span class="btn-sparkle-icon">✨</span>
          <span>Open A Birthday Gift</span>
          <span class="btn-sparkle-icon">🎁</span>
        </button>

        <!-- Delivery Chute -->
        <div class="dispenser-chute">
          <span class="chute-label" id="chuteLabel">GIFT CHUTE • READY</span>
          <div class="dropped-capsule" id="droppedCapsule">🎁</div>
        </div>
      </div>
    </div>

    <!-- Scroll to Top / Replay indicator -->
    <button class="scroll-down-hint" id="scrollDownBtn">
      <span>Replay from Beginning ↺</span>
      <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
    </button>
  </div>
</div>

<!-- Modal Gift Card Reveal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="gift-card" id="giftCard">
    <div class="card-top-icon" id="cardTopIcon">💝</div>
    <div class="card-header-badge">
      <span>★ A Message From My Heart ★</span>
    </div>
    <div class="message-box">
      <p class="message-text" id="giftMessageText">Loading...</p>
    </div>
    <div class="card-actions">
      <button class="again-btn" id="againBtn">🎁 Pull Another Gift ✨</button>
      <button class="close-btn" id="closeBtn">Back to Machine ✕</button>
    </div>
  </div>
</div>

<script>
  // The 7 Messages provided by the user
  const GIFTS = [
    "You are the most beautiful part of my life, and every moment with you feels like a beautiful dream. I wish I could make you smile every single day. May your life always be filled with happiness. Stay by my side forever. Happy Birthday, my beautiful girl! ❤️",
    "The world may be full of beautiful things, but nothing is as special as you are to me. Every moment with you becomes a memory I never want to forget. May all your dreams come true. Keep smiling and shining forever. Happy Birthday, my sweetheart! 💗",
    "I don't need a perfect world because having you in my life makes everything perfect. Your smile makes my days brighter, and your presence makes every moment special. I wish you endless happiness and love. Happy Birthday to my favorite person! ❤️",
    "Some people make life beautiful just by being in it, and you are that person for me. Every second with you feels like magic. I hope life gives you all the happiness your heart deserves. Never stop smiling. Happy Birthday, my precious girl! 🌸",
    "If I could make one wish today, it would be to see you happy every day of your life. You make ordinary moments feel extraordinary, and I am grateful for every memory we share. May our beautiful journey continue forever. Happy Birthday, my dearest girl! ❤️",
    "Happy birthday, darling! You are the person in my life that I can never think of losing. I pray to God that every day of your life is filled with happiness, laughter and joy. Happy birthday! ❤️",
    "Happy birthday, the most beautiful feeling in the world I know! Life may be the same for everyone, but every moment I have with you is different, magical. Hold my hand like this for the rest of your life. Happy birthday my dear beautifull girl! ❤️"
  ];

  const ICONS = ["💝", "💌", "💖", "🌸", "🎁", "✨", "🎀"];

  let lastIndex = -1;
  function getRandomGift() {
    let newIndex;
    do {
      newIndex = Math.floor(Math.random() * GIFTS.length);
    } while (newIndex === lastIndex && GIFTS.length > 1);
    lastIndex = newIndex;
    return {
      text: GIFTS[newIndex],
      icon: ICONS[newIndex % ICONS.length]
    };
  }

  // Synthesized Web Audio Sound Effects (Zero external file dependencies)
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // Gear spinning / rumble sound
  function playRumbleSound() {
    initAudio();
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(260, audioCtx.currentTime + 0.6);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.6);
  }

  // Celebratory Fanfare Bells Chord (C5, E5, G5, C6)
  function playCelebrationChimes() {
    initAudio();
    if (!audioCtx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
    notes.forEach((freq, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const startTime = audioCtx.currentTime + idx * 0.08;
      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.22, startTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 1.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + 1.25);
    });
  }

  // Confetti Explosion
  function triggerCelebrationConfetti() {
    if (typeof confetti === 'function') {
      // Big center burst
      confetti({
        particleCount: 85,
        spread: 90,
        origin: { y: 0.55 },
        colors: ['#f43f5e', '#ec4899', '#fbbf24', '#a855f7', '#ffffff']
      });

      // Left blast
      setTimeout(() => {
        confetti({
          particleCount: 50,
          angle: 60,
          spread: 70,
          origin: { x: 0.1, y: 0.6 },
          colors: ['#ec4899', '#f472b6', '#fbbf24']
        });
      }, 150);

      // Right blast
      setTimeout(() => {
        confetti({
          particleCount: 50,
          angle: 120,
          spread: 70,
          origin: { x: 0.9, y: 0.6 },
          colors: ['#8b5cf6', '#c084fc', '#ffffff']
        });
      }, 300);
    }
  }

  // DOM elements
  const dispenseBtn = document.getElementById('dispenseBtn');
  const machineBox = document.getElementById('machineBox');
  const globeChamber = document.getElementById('globeChamber');
  const chuteLabel = document.getElementById('chuteLabel');
  const droppedCapsule = document.getElementById('droppedCapsule');
  const modalBackdrop = document.getElementById('modalBackdrop');
  const giftMessageText = document.getElementById('giftMessageText');
  const cardTopIcon = document.getElementById('cardTopIcon');
  const againBtn = document.getElementById('againBtn');
  const closeBtn = document.getElementById('closeBtn');
  const scrollDownBtn = document.getElementById('scrollDownBtn');

  let isDispensing = false;

  function dispenseGift() {
    if (isDispensing) return;
    isDispensing = true;
    dispenseBtn.classList.add('disabled');

    // Step 1: Start rumble & capsule agitation
    machineBox.classList.add('shaking');
    globeChamber.classList.add('active');
    chuteLabel.textContent = "DISPENSING SURPRISE...";
    chuteLabel.style.color = "#f472b6";
    playRumbleSound();

    // Step 2: Drop capsule into chute after 700ms
    setTimeout(() => {
      machineBox.classList.remove('shaking');
      globeChamber.classList.remove('active');

      const gift = getRandomGift();
      droppedCapsule.textContent = gift.icon;
      droppedCapsule.classList.add('drop');
      chuteLabel.textContent = "GIFT READY! OPENING...";

      // Step 3: Open Gift Modal with Confetti Celebration
      setTimeout(() => {
        giftMessageText.textContent = gift.text;
        cardTopIcon.textContent = gift.icon;
        modalBackdrop.classList.add('show');
        playCelebrationChimes();
        triggerCelebrationConfetti();

        // Reset chute
        setTimeout(() => {
          droppedCapsule.classList.remove('drop');
          chuteLabel.textContent = "GIFT CHUTE • READY";
          chuteLabel.style.color = "rgba(255, 255, 255, 0.4)";
          dispenseBtn.classList.remove('disabled');
          isDispensing = false;
        }, 500);
      }, 550);
    }, 750);
  }

  dispenseBtn.addEventListener('click', dispenseGift);

  againBtn.addEventListener('click', () => {
    modalBackdrop.classList.remove('show');
    setTimeout(dispenseGift, 300);
  });

  closeBtn.addEventListener('click', () => {
    modalBackdrop.classList.remove('show');
  });

  // Modal backdrop click to close
  modalBackdrop.addEventListener('click', (e) => {
    if (e.target === modalBackdrop) {
      modalBackdrop.classList.remove('show');
    }
  });

  // Background stars animation
  (function initStars() {
    const canvas = document.getElementById('starsCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let stars = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < 45; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.8 + 0.6,
        alpha: Math.random(),
        speed: Math.random() * 0.02 + 0.01
      });
    }

    function render() {
      ctx.clearRect(0, 0, width, height);
      stars.forEach(s => {
        s.alpha += s.speed;
        const opacity = (Math.sin(s.alpha) + 1) / 2 * 0.7 + 0.2;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
        ctx.shadowColor = '#f472b6';
        ctx.shadowBlur = 6;
        ctx.fill();
      });
      requestAnimationFrame(render);
    }
    render();
  })();

  // Scrolling & Touch Forwarding to Main Snap Container
  function scrollToNext() {
    try {
      const parentContainer = window.parent.document.getElementById('main-scroll-container');
      const target = window.parent.document.getElementById('section-1');
      if (target) {
        target.scrollIntoView({ behavior: 'smooth' });
      } else if (parentContainer) {
        parentContainer.scrollTo({ top: 0, behavior: 'smooth' });
      }
    } catch (e) {}
  }

  function scrollToPrev() {
    try {
      const parentContainer = window.parent.document.getElementById('main-scroll-container');
      const target = window.parent.document.getElementById('section-6');
      if (target) {
        target.scrollIntoView({ behavior: 'smooth' });
      } else if (parentContainer) {
        parentContainer.scrollBy({ top: -window.innerHeight, behavior: 'smooth' });
      }
    } catch (e) {}
  }

  scrollDownBtn.addEventListener('click', scrollToNext);

  // Wheel forwarding (only when modal is not open)
  window.addEventListener('wheel', (e) => {
    if (modalBackdrop.classList.contains('show')) return;
    try {
      const parentContainer = window.parent.document.getElementById('main-scroll-container');
      if (parentContainer) {
        parentContainer.scrollBy({ top: e.deltaY, behavior: 'auto' });
      }
    } catch (err) {}
  }, { passive: true });

  // Touch swipe support
  let touchStartY = 0;
  window.addEventListener('touchstart', (e) => {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  window.addEventListener('touchend', (e) => {
    if (modalBackdrop.classList.contains('show')) return;
    const diffY = touchStartY - e.changedTouches[0].clientY;
    if (Math.abs(diffY) > 55) {
      if (diffY > 0) {
        scrollToNext();
      } else {
        scrollToPrev();
      }
    }
  }, { passive: true });

  // Keyboard navigation
  window.addEventListener('keydown', (e) => {
    if (modalBackdrop.classList.contains('show')) {
      if (e.key === 'Escape') {
        modalBackdrop.classList.remove('show');
      }
      return;
    }
    if (e.key === 'ArrowDown' || e.key === 'PageDown') {
      e.preventDefault();
      scrollToNext();
    } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
      e.preventDefault();
      scrollToPrev();
    } else if (e.key === ' ') {
      e.preventDefault();
      dispenseGift();
    }
  });
</script>

</body>
</html>
